<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .ios-icon {
      border-radius: 22.5%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .ios-icon:active {
      transform: scale(0.92);
      opacity: 0.85;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-900 flex items-center justify-center min-h-screen p-4 antialiased select-none font-sans">

  <!-- ============================================================ -->
  <!-- ⚙️ [설정 구역] 여기서 카톡 대화, 인스타 게시물/글을 자유롭게 수정하세요! -->
  <!-- ============================================================ -->
  <script>
    const CUSTOM_DATA = {
      // 1. 카톡 알림 및 대화 설정
      senderName: "자기",
      notificationDelay: 10, // 알림 뜨는 시간 (초)
      chatMessages: [
        { sender: "other", text: "미안해", time: "오후 6:30" },
        { sender: "other", text: "화 많이 났어...?", time: "오후 6:31" },
        { sender: "me",    text: "나중에 얘기해", time: "오후 6:32" },
        { sender: "other", text: "잠깐만 내 말 좀 들어봐", time: "오후 6:33" }
      ],

      // 2. 남주 인스타그램 기본 정보
      instagram: {
        username: "riku",          // 계정 ID
        postsCount: "3",           // 게시물 수
        followersCount: "3.1만",    // 팔로워 수
        followingCount: "128",     // 팔로잉 수
        name: "riku",              // 프로필 이름
        bio: "",                   // 소개글 (원하시면 채우셔도 됩니다)
      },

      // 3. 인스타 게시물 (격자 그리드 및 클릭 시 상세 화면에 반영)
      posts: [
        {
          id: 0,
          image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&fit=crop", // 1번 사진 URL
          likes: "2,643",
          reposts: "2.9만",
          content: "<span class='text-blue-500 font-medium'>@guzzi @elle</span>",
          translation: ""
        },
        {
          id: 1,
          image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&fit=crop", // 2번 사진 URL
          likes: "2,744",
          reposts: "3.1만",
          content: "작업실",
          translation: ""
        },
        {
          id: 2,
          image: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&fit=crop", // 3번 사진 URL
          likes: "2,749",
          reposts: "3.1만",
          content: "自撮りってなんかぎこちなくなる",
          translation: "셀카 찍으면 왠지 어색해져"
        }
      ]
    };
  </script>

  <!-- 아이폰 본체 -->
  <div class="relative w-[390px] h-[844px] bg-black rounded-[54px] p-3 shadow-[0_25px_70px_rgba(0,0,0,0.6)] border-[4px] border-zinc-700/60 ring-1 ring-zinc-800">
    
    <!-- 측면 버튼 -->
    <div class="absolute -left-[7px] top-[115px] w-[3px] h-[26px] bg-zinc-600 rounded-l-md"></div>
    <div class="absolute -left-[7px] top-[160px] w-[3px] h-[50px] bg-zinc-600 rounded-l-md"></div>
    <div class="absolute -left-[7px] top-[220px] w-[3px] h-[50px] bg-zinc-600 rounded-l-md"></div>
    <div class="absolute -right-[7px] top-[170px] w-[3px] h-[75px] bg-zinc-600 rounded-r-md"></div>

    <!-- 내부 스크린 -->
    <div class="relative w-full h-full rounded-[44px] overflow-hidden flex flex-col justify-between bg-zinc-950">
      
      <!-- 상단 상태바 & 다이내믹 아일랜드 -->
      <div class="relative z-50 flex justify-between items-center px-7 pt-3.5 pb-2 text-white">
        <span id="current-time" class="text-[14px] font-semibold tracking-tight drop-shadow">9:41</span>
        
        <div class="absolute left-1/2 -translate-x-1/2 top-2.5 h-[28px] w-[110px] bg-black rounded-full flex items-center justify-end pr-3.5 gap-2">
          <div class="w-3 h-3 rounded-full bg-zinc-900 border border-zinc-800"></div>
        </div>

        <div class="flex items-center gap-1.5 drop-shadow">
          <i data-lucide="signal" class="w-4 h-4"></i>
          <i data-lucide="wifi" class="w-4 h-4"></i>
          <div class="w-5 h-2.5 border border-white rounded-[4px] p-[1px] flex items-center">
            <div class="w-3 h-full bg-white rounded-[1px]"></div>
          </div>
        </div>
      </div>

      <!-- 10초 뒤 푸시 알림 배너 -->
      <div id="push-notification" class="absolute top-12 left-3 right-3 z-50 transition-all duration-500 transform -translate-y-48 opacity-0 cursor-pointer">
        <div class="bg-zinc-800/90 backdrop-blur-xl border border-white/10 text-white rounded-3xl p-3.5 shadow-2xl flex items-start gap-3">
          <div class="w-9 h-9 bg-yellow-400 rounded-xl flex items-center justify-center shrink-0 text-amber-950 font-black text-lg shadow-sm">
            💬
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-zinc-100" id="noti-sender">자기</span>
              <span class="text-[10px] text-zinc-400">지금</span>
            </div>
            <p class="text-xs text-zinc-200 mt-0.5 truncate" id="noti-message">미안해</p>
          </div>
        </div>
      </div>

      <!-- ================= 홈 화면 ================= -->
      <div id="home-screen" class="absolute inset-0 pt-14 pb-4 px-4 flex flex-col justify-between bg-gradient-to-tr from-sky-500 via-indigo-600 to-purple-700">
        
        <!-- 앱 아이콘 그리드 -->
        <div class="px-2 pt-2 grid grid-cols-4 gap-y-7 gap-x-4">
          <!-- 1. 카메라 -->
          <div class="flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-gradient-to-b from-zinc-300 via-zinc-400 to-zinc-500 flex items-center justify-center text-zinc-800">
              <i data-lucide="camera" class="w-7 h-7 stroke-[1.8]"></i>
            </div>
            <span class="text-[11px] text-white font-medium drop-shadow-md">카메라</span>
          </div>

          <!-- 2. 사진 -->
          <div class="flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-white flex items-center justify-center">
              <div class="relative w-7 h-7 flex items-center justify-center">
                <span class="absolute w-2.5 h-4 bg-yellow-400 rounded-full opacity-80 -translate-y-1.5"></span>
                <span class="absolute w-2.5 h-4 bg-red-500 rounded-full opacity-80 translate-x-1.5"></span>
                <span class="absolute w-2.5 h-4 bg-blue-500 rounded-full opacity-80 translate-y-1.5"></span>
                <span class="absolute w-2.5 h-4 bg-emerald-500 rounded-full opacity-80 -translate-x-1.5"></span>
              </div>
            </div>
            <span class="text-[11px] text-white font-medium drop-shadow-md">사진</span>
          </div>

          <!-- 3. 메모 -->
          <div class="flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-white flex flex-col overflow-hidden">
              <div class="h-4 bg-amber-400 w-full"></div>
              <div class="flex-1 p-2 flex flex-col justify-around">
                <div class="h-0.5 bg-zinc-200 rounded w-full"></div>
                <div class="h-0.5 bg-zinc-200 rounded w-3/4"></div>
                <div class="h-0.5 bg-zinc-200 rounded w-5/6"></div>
              </div>
            </div>
            <span class="text-[11px] text-white font-medium drop-shadow-md">메모</span>
          </div>

          <!-- 4. 인스타그램 -->
          <div onclick="openInstagram()" class="flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 flex items-center justify-center text-white">
              <i data-lucide="instagram" class="w-7 h-7 stroke-[1.8]"></i>
            </div>
            <span class="text-[11px] text-white font-medium drop-shadow-md">Instagram</span>
          </div>

          <!-- 5. 설정 -->
          <div class="flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-gradient-to-b from-zinc-200 via-zinc-400 to-zinc-500 flex items-center justify-center text-zinc-700">
              <i data-lucide="settings" class="w-7 h-7 stroke-[1.8]"></i>
            </div>
            <span class="text-[11px] text-white font-medium drop-shadow-md">설정</span>
          </div>

          <!-- 6. 음악 -->
          <div class="flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-gradient-to-b from-rose-400 via-pink-500 to-rose-600 flex items-center justify-center text-white">
              <i data-lucide="music" class="w-7 h-7 stroke-[1.8]"></i>
            </div>
            <span class="text-[11px] text-white font-medium drop-shadow-md">음악</span>
          </div>

          <!-- 7. 카카오톡 -->
          <div onclick="openKakaoTalk()" class="relative flex flex-col items-center gap-1.5 cursor-pointer">
            <div class="ios-icon w-[60px] h-[60px] bg-yellow-400 flex items-center justify-center text-amber-950 font-black text-2xl">
              💬
            </div>
            <span id="kakao-badge" class="hidden absolute top-0 right-1 w-5 h-5 bg-red-500 text-white text-[11px] font-bold rounded-full flex items-center justify-center ring-2 ring-white">1</span>
            <span class="text-[11px] text-white font-medium drop-shadow-md">카카오톡</span>
          </div>
        </div>

        <!-- 독바 (전화, 사파리, 메시지) -->
        <div class="w-full h-[88px] bg-white/25 backdrop-blur-2xl rounded-[35px] border border-white/20 px-6 flex items-center justify-around shadow-lg mb-4">
          <div class="ios-icon w-[58px] h-[58px] bg-emerald-500 flex items-center justify-center text-white cursor-pointer shadow-md">
            <i data-lucide="phone" class="w-7 h-7 fill-white stroke-none"></i>
          </div>
          <div class="ios-icon w-[58px] h-[58px] bg-white flex items-center justify-center cursor-pointer shadow-md">
            <i data-lucide="compass" class="w-8 h-8 text-sky-500 stroke-[1.5]"></i>
          </div>
          <div class="ios-icon w-[58px] h-[58px] bg-emerald-500 flex items-center justify-center text-white cursor-pointer shadow-md">
            <i data-lucide="message-circle" class="w-7 h-7 fill-white stroke-none"></i>
          </div>
        </div>

      </div>

      <!-- ================= 카카오톡 앱 ================= -->
      <div id="kakao-app" class="hidden absolute inset-0 pt-12 pb-6 flex flex-col bg-[#abc1d1] z-40">
        <div class="px-4 py-2 flex items-center justify-between border-b border-black/5 bg-[#abc1d1]">
          <div class="flex items-center gap-3">
            <button onclick="goHome()" class="text-zinc-800"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
            <span class="font-bold text-base text-zinc-900" id="chat-header-name">자기</span>
          </div>
          <div class="flex items-center gap-3 text-zinc-800">
            <i data-lucide="search" class="w-5 h-5"></i>
            <i data-lucide="menu" class="w-5 h-5"></i>
          </div>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar"></div>

        <div class="px-3 py-2 bg-white flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-zinc-100 flex items-center justify-center text-zinc-400">+</div>
          <input type="text" placeholder="메시지 입력..." class="flex-1 bg-zinc-100 text-xs px-3 py-2 rounded-full outline-none" disabled>
          <div class="w-8 h-8 rounded-full bg-yellow-400 flex items-center justify-center text-amber-950 text-xs font-bold">#</div>
        </div>
      </div>

      <!-- ================= 인스타그램 1단계: 프로필 & 격자 그리드 화면 ================= -->
      <div id="insta-profile-view" class="hidden absolute inset-0 pt-11 pb-6 flex flex-col bg-white text-black z-40 overflow-y-auto no-scrollbar">
        <!-- 상단 헤더 -->
        <div class="px-4 py-2 flex items-center justify-between border-b border-zinc-100 sticky top-0 bg-white z-10">
          <div class="flex items-center gap-2">
            <button onclick="goHome()"><i data-lucide="chevron-left" class="w-6 h-6 text-zinc-800"></i></button>
            <span class="font-bold text-sm tracking-tight" id="profile-header-username">riku</span>
          </div>
          <div class="flex items-center gap-4 text-zinc-800">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <i data-lucide="more-horizontal" class="w-5 h-5"></i>
          </div>
        </div>

        <!-- 남주 프로필 정보 (기본 프사) -->
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <!-- 기본 프사 (회색 사람 실루엣) -->
            <div class="w-18 h-18 w-[72px] h-[72px] rounded-full bg-zinc-200 border border-zinc-300 flex items-center justify-center text-zinc-400 shrink-0">
              <i data-lucide="user" class="w-9 h-9 stroke-[1.5]"></i>
            </div>
            
            <div class="flex gap-6 text-center pr-3">
              <div>
                <p class="font-bold text-sm" id="profile-posts-count">3</p>
                <p class="text-xs text-zinc-400">게시물</p>
              </div>
              <div>
                <p class="font-bold text-sm" id="profile-followers-count">3.1만</p>
                <p class="text-xs text-zinc-400">팔로워</p>
              </div>
              <div>
                <p class="font-bold text-sm" id="profile-following-count">128</p>
                <p class="text-xs text-zinc-400">팔로잉</p>
              </div>
            </div>
          </div>

          <div>
            <p class="font-bold text-xs" id="profile-name">riku</p>
            <p class="text-xs text-zinc-500 whitespace-pre-line mt-0.5" id="profile-bio"></p>
          </div>

          <div class="flex gap-2">
            <button class="flex-1 bg-zinc-100 text-xs font-semibold py-1.5 rounded-lg border border-zinc-200">팔로잉</button>
            <button class="flex-1 bg-zinc-100 text-xs font-semibold py-1.5 rounded-lg border border-zinc-200">메시지</button>
          </div>
        </div>

        <!-- 3x3 격자 그리드 아이콘 탭 -->
        <div class="border-t border-zinc-200 flex justify-center py-2">
          <i data-lucide="grid" class="w-5 h-5 text-black"></i>
        </div>

        <!-- 3x3 격자 썸네일 그리드 (누르면 상세 피드로 이동) -->
        <div id="grid-container" class="grid grid-cols-3 gap-0.5">
          <!-- 스크립트로 자동 생성 -->
        </div>
      </div>

      <!-- ================= 인스타그램 2단계: 피드 상세 뷰 (스크린샷 싱크로) ================= -->
      <div id="insta-detail-view" class="hidden absolute inset-0 pt-11 pb-6 flex flex-col bg-white text-black z-40">
        <!-- 상단 헤더: 뒤로가기 누르면 격자 그리드로 복귀 -->
        <div class="px-3 py-2 flex items-center justify-between border-b border-zinc-100 bg-white shrink-0">
          <button onclick="backToGrid()" class="w-8 h-8 rounded-full bg-zinc-100 flex items-center justify-center text-zinc-800">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <span class="text-xs font-bold text-zinc-800" id="detail-top-username">riku</span>
          <div class="w-8"></div>
        </div>

        <!-- 상세 게시물 리스트 (스크롤 가능) -->
        <div id="detail-feed-container" class="flex-1 overflow-y-auto no-scrollbar space-y-6 pb-10">
          <!-- 스크립트로 자동 렌더링 -->
        </div>
      </div>

      <!-- 하단 홈 인디케이터 (누르면 언제든 홈으로 복귀) -->
      <div onclick="goHome()" class="relative z-50 py-2 flex justify-center items-center cursor-pointer">
        <div class="w-32 h-1 bg-white/90 rounded-full transition-transform hover:scale-105"></div>
      </div>

    </div>
  </div>

  <script>
    // 1. 기본 아이콘 및 텍스트 렌더링
    lucide.createIcons();

    // 카톡 연동
    document.getElementById('noti-sender').textContent = CUSTOM_DATA.senderName;
    document.getElementById('noti-message').textContent = CUSTOM_DATA.chatMessages[0].text;
    document.getElementById('chat-header-name').textContent = CUSTOM_DATA.senderName;

    // 인스타 프로필 연동
    document.getElementById('profile-header-username').textContent = CUSTOM_DATA.instagram.username;
    document.getElementById('profile-posts-count').textContent = CUSTOM_DATA.posts.length;
    document.getElementById('profile-followers-count').textContent = CUSTOM_DATA.instagram.followersCount;
    document.getElementById('profile-following-count').textContent = CUSTOM_DATA.instagram.followingCount;
    document.getElementById('profile-name').textContent = CUSTOM_DATA.instagram.name;
    document.getElementById('profile-bio').textContent = CUSTOM_DATA.instagram.bio;
    document.getElementById('detail-top-username').textContent = CUSTOM_DATA.instagram.username;

    // 카카오톡 채팅창 생성
    const chatContainer = document.getElementById('chat-messages');
    CUSTOM_DATA.chatMessages.forEach(msg => {
      const isMe = msg.sender === 'me';
      const bubble = document.createElement('div');
      bubble.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      bubble.innerHTML = `
        <div class="flex items-end gap-1.5 max-w-[80%] ${isMe ? 'flex-row-reverse' : ''}">
          <div class="p-2.5 rounded-2xl text-xs ${isMe ? 'bg-yellow-300 text-zinc-900 rounded-tr-none' : 'bg-white text-zinc-900 rounded-tl-none'} shadow-sm">
            ${msg.text}
          </div>
          <span class="text-[9px] text-zinc-600 mb-0.5">${msg.time}</span>
        </div>
      `;
      chatContainer.appendChild(bubble);
    });

    // 2. 인스타 프로필 그리드 생성
    const gridContainer = document.getElementById('grid-container');
    CUSTOM_DATA.posts.forEach((post, index) => {
      const gridItem = document.createElement('div');
      gridItem.className = "aspect-square bg-zinc-100 overflow-hidden cursor-pointer";
      gridItem.innerHTML = `<img src="${post.image}" class="w-full h-full object-cover hover:opacity-90 transition">`;
      gridItem.onclick = () => openDetailView(index);
      gridContainer.appendChild(gridItem);
    });

    // 3. 인스타 상세 피드(보내주신 스크린샷 양식) 생성
    const detailContainer = document.getElementById('detail-feed-container');
    CUSTOM_DATA.posts.forEach((post) => {
      const postCard = document.createElement('div');
      postCard.id = `post-${post.id}`;
      postCard.className = "flex flex-col border-b border-zinc-100 pb-4";
      postCard.innerHTML = `
        <!-- 사진 -->
        <div class="relative w-full aspect-[4/5] bg-zinc-900 overflow-hidden">
          <img src="${post.image}" class="w-full h-full object-cover">
        </div>

        <!-- 하트, 댓글, 리포스트, 비행기 아이콘 -->
        <div class="px-4 pt-3 flex items-center justify-between text-black">
          <div class="flex items-center gap-4">
            <button class="hover:opacity-70"><i data-lucide="heart" class="w-6 h-6 stroke-[1.8]"></i></button>
            <div class="flex items-center gap-1.5">
              <i data-lucide="message-circle" class="w-6 h-6 stroke-[1.8]"></i>
              <span class="text-xs font-bold">${post.likes}</span>
            </div>
            <div class="flex items-center gap-1.5">
              <i data-lucide="repeat-2" class="w-6 h-6 stroke-[1.8]"></i>
              <span class="text-xs font-bold">${post.reposts}</span>
            </div>
          </div>
          <button class="hover:opacity-70"><i data-lucide="send" class="w-6 h-6 stroke-[1.8]"></i></button>
        </div>

        <!-- ...님 외 여러 명이 좋아합니다 (기본 프사) -->
        <div class="px-4 pt-2.5 space-y-1">
          <div class="flex items-center gap-1.5 text-xs text-zinc-900">
            <div class="w-4 h-4 rounded-full bg-zinc-200 border border-zinc-300 flex items-center justify-center shrink-0">
              <i data-lucide="user" class="w-2.5 h-2.5 text-zinc-500"></i>
            </div>
            <p><span class="font-bold">...</span>님 외 여러 명이 좋아합니다</p>
          </div>

          <!-- 작성자 riku & 본문 내용 -->
          <div class="text-xs leading-relaxed text-zinc-900 pt-0.5">
            <span class="font-bold mr-1.5">${CUSTOM_DATA.instagram.username}</span>
            <span>${post.content}</span>
          </div>

          <!-- 번역 보기 (있을 때만 표시) -->
          ${post.translation ? `
            <div class="pt-1">
              <span class="text-[10px] text-zinc-400 block">번역 보기</span>
              <p class="text-xs text-zinc-700 mt-0.5">${post.translation}</p>
            </div>
          ` : ''}
        </div>
      `;
      detailContainer.appendChild(postCard);
    });

    lucide.createIcons();

    // 4. 10초 뒤 푸시 알림 도착
    setTimeout(() => {
      const noti = document.getElementById('push-notification');
      noti.classList.remove('-translate-y-48', 'opacity-0');
      document.getElementById('kakao-badge').classList.remove('hidden');

      noti.onclick = () => {
        openKakaoTalk();
        noti.classList.add('-translate-y-48', 'opacity-0');
      };
    }, CUSTOM_DATA.notificationDelay * 1000);

    // 5. 화면 제어 로직
    function openInstagram() {
      document.getElementById('insta-profile-view').classList.remove('hidden');
      document.getElementById('insta-detail-view').classList.add('hidden');
      document.getElementById('kakao-app').classList.add('hidden');
    }

    function openDetailView(index) {
      document.getElementById('insta-profile-view').classList.add('hidden');
      document.getElementById('insta-detail-view').classList.remove('hidden');
      // 클릭한 사진 위치로 스크롤 이동
      const targetPost = document.getElementById(`post-${index}`);
      if (targetPost) targetPost.scrollIntoView();
    }

    function backToGrid() {
      document.getElementById('insta-detail-view').classList.add('hidden');
      document.getElementById('insta-profile-view').classList.remove('hidden');
    }

    function openKakaoTalk() {
      document.getElementById('kakao-app').classList.remove('hidden');
      document.getElementById('insta-profile-view').classList.add('hidden');
      document.getElementById('insta-detail-view').classList.add('hidden');
    }

    function goHome() {
      document.getElementById('kakao-app').classList.add('hidden');
      document.getElementById('insta-profile-view').classList.add('hidden');
      document.getElementById('insta-detail-view').classList.add('hidden');
    }

    // 6. 실시간 시계 연동
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('current-time').textContent = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
